name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      subs:
        description: "Enter subdomains (e.g. 'prod', 'test')"
        required: false
        default: "test"

env:
  NODE_VERSION: "20"
  SUBS_TEST: "test"

jobs:
  security-check:
    runs-on: ubuntu-latest
    name: Security Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for exposed secrets
        run: |
          # Fail if .env file is committed
          if git log --all --full-history -- .env | grep -q "commit"; then
            echo "ERROR: .env file found in git history"
            exit 1
          fi
          # Check for common secret patterns
          if grep -r "VITE_SUPABASE_PUBLISHABLE_KEY\|R2_ACCESS_KEY_ID\|R2_SECRET_ACCESS_KEY" --include="*.js" --include="*.ts" --include="*.json" .; then
            echo "WARNING: Potential secrets in source files"
          fi

      - name: Verify required environment setup
        run: |
          echo "Checking deployment configuration..."
          # This will fail early if secrets aren't configured
          [ -n "${{ secrets.HOSTINGER_SSH_KEY }}" ] || (echo "ERROR: HOSTINGER_SSH_KEY not configured" && exit 1)

  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint & Test
    needs: security-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [security-check, lint-and-test]
    name: Build & Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://olive-tiger-723036.hostingersite.com
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_R2_PUBLIC_URL: ${{ secrets.VITE_R2_PUBLIC_URL }}
        run: npm run build

      - name: Detect output dir (CRA vs Vite)
        id: out
        run: |
          if [ -d "dist" ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "dir=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${SSH_PORT:-65002}"
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to selected subdomains (no delete)
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          ROOT_PATH: ${{ secrets.HOSTINGER_PATH }}   # e.g. /home/u123/public_html
          RSYNC_SRC: ${{ steps.out.outputs.dir }}/
          SUBS_INPUT: ${{ inputs.subs }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-65002}"

          # Decide which subfolders to deploy
          if [ "${SUBS_INPUT,,}" = "prod" ]; then
            #SUBS="${SUBS_ALL}"
            
            echo "Deploying to main site ($ROOT_PATH)…"
            rsync -az -e "ssh -p $PORT" "$RSYNC_SRC" "$SSH_USER@$SSH_HOST:$ROOT_PATH/"
          else
            SUBS="${SUBS_TEST}"
            echo "Deploying to: $SUBS"

            echo "Deploying to $SUBS…"
            rsync -az -e "ssh -p $PORT" "$RSYNC_SRC" "$SSH_USER@$SSH_HOST:$ROOT_PATH/$SUBS"

          fi

          echo "✅ Deployment complete."
