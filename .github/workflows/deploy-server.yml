name: Deploy Upload API Server

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${SSH_PORT:-65002}"
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Server Files to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          # Path to upload subdomain folder (e.g., /home/u123/public_html/upload or custom path)
          # Make sure to set HOSTINGER_SERVER_PATH in your GitHub repository secrets.
          SERVER_PATH: ${{ secrets.HOSTINGER_SERVER_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-65002}"
          
          if [ -z "$SERVER_PATH" ]; then
            echo "❌ Error: SERVER_PATH secret is not set. Please set HOSTINGER_SERVER_PATH secret."
            exit 1
          fi

          echo "Deploying server files to $SERVER_PATH..."
          # Deploy only the server/ directory contents, excluding node_modules, .env and settings.json
          rsync -az -e "ssh -p $PORT" \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='settings.json' \
            server/ "$SSH_USER@$SSH_HOST:$SERVER_PATH/"

      - name: Install dependencies and restart server
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SERVER_PATH: ${{ secrets.HOSTINGER_SERVER_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-65002}"
          
          echo "Running remote install and restart commands..."
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "
            cd $SERVER_PATH
            # Install production dependencies
            npm install --omit=dev
            
            # Restart mechanism
            # (Checks if PM2 is running and restarts, otherwise touches tmp/restart.txt for Passenger/Hostinger Node service)
            if command -v pm2 &> /dev/null; then
              pm2 restart upload-api || pm2 start server.js --name upload-api
            else
              mkdir -p tmp && touch tmp/restart.txt
              echo 'Node service restart signaled via tmp/restart.txt'
            fi
          "
          echo "✅ Server deployment complete."
