<!doctype html>
<html lang="en">
  <head>

    <!-- Primary Meta Tags -->
    <title>Share My Shoot - Professional Photo Gallery Platform for Photographers</title>

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sharemyshoot.com/" />
    
    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Structured Data -->
    <script type="application/ld+json">

      "@context": "https://schema.org",
